<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>DySToPHy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @font-face {
      font-family: 'Gothic';
      src: url('fonts/fuente10.ttf') format('truetype');
      font-display: swap;
    }

    html {
      background-color: black;
    }
  </style>
</head>

<body>

  <!-- -------------- PANTALLA DE MALVENIDA ------------------ -->

  <div class="container-start">
    <div></div>
    <h1 id="msg-malvenida" class="central">DySToPHy</h1>
    <button onclick="jugar()" class="central"> SUFRIR </button>
  </div>

  <!-- --------------CONFIGURACIONES ------------------ -->

  <button class="configuraciones" onclick="abrirConfig()"><img id="ajustes" src="img/SVGs/ajustes.svg"></button>
  <div class="container-config" style="background-color: transparent;">
    <button id="expandirPantalla" class="configuraciones" onclick="ampliar()">MAXIMIZAR MINIMIZAR</button>

    <button id="rotarPantalla" class="configuraciones" onclick="rotar()">ROTAR</button>
  </div>


  <!-- -------------- BOTONES MOVILES ------------------ -->

  <div class="container-buttons" hidden>
    <div id="joystick">
      <div id="ballJoystick">&nbsp;</div>
    </div>
    <div id="zonaDeslice"></div>
    <button class="disparador"><img id="fuegoDeCañon" src="img/SVGs/fuegoDeCañon.svg"></button>
  </div>

  <!-- CANVAS -->

  <canvas id="canvas" style="display: none;"></canvas>

  <!-- ESTADISTICAS -->

  <table class="table" id="estadisticas" hidden>
    <tr>
      <th><span class="valor" id="salud">100%</span><img src="img/SVGs/corazon (2).svg"></th>
      <th><img src="img/prota/tyler.png"></th>
      <th><span class="valor" id="municion">50</span><img src="img/SVGs/arma.svg"></th>
    </tr>
  </table>

  <!-- SCRIPTS -->

  <script src="js/main.js" type="module"></script>
  <script src="js/controls/buttonsPc.js" type="module"></script>
  <script src="js/controls/buttonsAndroid.js" type="module"></script>
  <script src="js/ui/setting.js" type="module"></script>
</body>

</html>
