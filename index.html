<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>DySToPHy</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @font-face {
      font-family: 'Gothic';
      src: url('fonts/fuente10.ttf') format('truetype');
      font-display: swap;
    }

    html {
      background-color: black;
    }
  </style>
</head>

<body>

  <!-- -------------- PANTALLA DE MALVENIDA ------------------ -->

  <div class="container-start">
    <h1 id="msg-malvenida" class="central">MALVENIDO <br> A <br> DySToPHy</h1>
    <button onclick="jugar()" class="central"> TOCA PARA SUFRIR </button>
  </div>

  <!-- --------------CONFIGURACIONES ------------------ -->

  <button class="configuraciones" onclick="abrirConfig()"><svg xmlns="http://www.w3.org/2000/svg" fill="none"
      viewBox="0 0 24 24" id="Cog--Streamline-Sharp" height="24" width="24">
      <g id="cog--work-loading-cog-gear-settings-machine">
        <path id="Subtract" fill="#000000" fill-rule="evenodd"
          d="m22.935 9.44 -2.273 1.312a8.817 8.817 0 0 1 0 2.496l2.273 1.313 -3.25 5.629 -2.274 -1.313a8.742 8.742 0 0 1 -2.16 1.25l0 2.623h-6.5v-2.623a8.742 8.742 0 0 1 -2.162 -1.25L4.315 20.19l-3.25 -5.63 2.274 -1.312a8.817 8.817 0 0 1 0 -2.496L1.065 9.44l3.25 -5.63L6.59 5.124a8.742 8.742 0 0 1 2.161 -1.25V1.25h6.5v2.624c0.783 0.313 1.51 0.736 2.161 1.25l2.274 -1.313 3.25 5.629ZM12 15.5a3.5 3.5 0 1 0 0 -7 3.5 3.5 0 0 0 0 7Z"
          clip-rule="evenodd" stroke-width="1"></path>
      </g>
    </svg></button>
  <div class="container-config" style="background-color: transparent;">
    <button id="expandirPantalla" class="configuraciones" onclick="ampliar()">MAXIMIZAR MINIMIZAR</button>

    <button id="rotarPantalla" class="configuraciones" onclick="rotar()">ROTAR</button>

    <div id="cambiarResolucion" class="configuraciones">
      <span>RESOLUCIÓN</span>
      <input type="range" id="valorResolucion">
      <p>100%</p>
    </div>
  </div>


  <!-- -------------- BOTONES MOVILES ------------------ -->

  <div class="container-buttons" hidden>
    <div id="joystick">
      <div id="ballJoystick">&nbsp;</div>
    </div>
    <div id="zonaDeslice"></div>
    <button class="disparador"><svg width="12vw" height="12vw" viewBox="0 0 512.00 512.00"
        xmlns="http://www.w3.org/2000/svg" fill="#000000" stroke="#000000" stroke-width="0.00512"
        transform="matrix(1, 0, 0, 1, 0, 0)rotate(0)">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="SVGRepo_iconCarrier">
          <path fill="#000000"
            d="M293.324 20.738l-5.256 162.94L141.478 60.45l47.157 112.16L67.86 91.446 189.37 221.64 21.17 158.567 174.77 304.57l-113.885 2.92 160.02 77.09-127.9 14.602L196.91 435.81l-39.666 10.676 124.395 30.37-36.208 20.44h244.12v-91.835l-74.345-188.675 74.346 107.865v-44.025l-20.112-154.42-17.323 84.563L403.12 55.193 377.33 141 343.295 35.92l6.68 106.877-56.65-122.06zm12.133 116.823l73.764 121.56 15.376-30.233 38.836 141.656-73.946-103.967 9.682 76.022-77.018-20.64 102.518 91.044-33.8 6.584 93.515 53.76-202.012-61.412 64.49-21.9-113.56-57.97 74.012 13.08L156.25 242.18l126.86 37.164-19.96-60.555 69.795 44.25-27.488-125.48z">
          </path>
        </g>
      </svg></button>
  </div>
  <canvas id="canvas" hidden></canvas>
  <script src="js/main.js" type="module"></script>
  <script src="js/controls/buttonsPc.js" type="module"></script>
  <script src="js/controls/buttonsAndroid.js" type="module"></script>
  <script src="js/ui/setting.js" type="module"></script>
</body>

</html>
