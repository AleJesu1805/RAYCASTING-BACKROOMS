<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1">
  <title>DySToPHy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/SVGs/arma.svg" type="image/x-icon">
  <link rel="manifest" href="js/workers/manifest.json">
  <style>
    @font-face {
      font-family: 'Gothic';
      src: url('fonts/fuente10.ttf') format('truetype');
      font-display: swap;
    }

    html {
      background-color: rgb(30, 3, 3);
    }
  </style>
</head>

<body>

  <!-- -------------- PANTALLA DE MALVENIDA ------------------ -->

  <div class="container-start">
    <div></div>
    <h1 id="msg-malvenida" class="central">DySToPHy</h1>
    <button onclick="jugar()" class="central"> SUFRIR </button>
  </div>

  <!-- --------------CONFIGURACIONES ------------------ -->

  <button class="configuraciones" onclick="abrirConfig()"><img id="iconAjustes" src="img/SVGs/ajustes.svg"></button>
  <div class="container-config" style="background-color: transparent;">
    <button id="expandirPantalla" class="configuraciones" onclick="ampliar()">MAXIMIZAR <br> MINIMIZAR</button>
    <button id="rotarPantalla" class="configuraciones" onclick="rotar()">ROTAR</button>
    <div class="configuraciones" id="container-volumen">
      <span>Volúmen</span>
      <label for="musica">Música</label>
      <input type="range" value="20" id="musica">
      <label for="efectos">Efectos</label>
      <input type="range" value="80" id="efectos">
    </div>
  </div>


  <!-- -------------- BOTONES MOVILES ------------------ -->

  <div class="container-buttons" hidden>
    <div id="joystick">
      <div id="ballJoystick">&nbsp;</div>
    </div>
    <div class="zonaDeslice"></div>
    <div class="zonaDeslice"></div>
    <button class="disparador"><img src="img/SVGs/fuegoDeCañon.svg"></button>
    <button class="disparador"><img src="img/SVGs/fuegoDeCañon.svg"></button>
  </div>

  <!-- CANVAS -->

  <canvas id="canvas" class="hidden"></canvas>
  <div class="elements-arma hidden">
    <div id="puntero"></div>
    <img id="explosionArma" src="img/armas/explosionArma.png">
    <img id="arma" src="img/armas/imgArmaTrue.webp">
  </div>

  <!-- SALUD -->

  <div id="container-salud" class="hidden">
    <span id="valorSalud">100%</span><img src="img/SVGs/corazon (2).svg">
  </div>

  <!-- CRONOMETRO -->

  <div id="container-cronometro" class="hidden"><span id="tiempo">00:00</span></div>

  <!-- GAME OVER -->

  <div class="container-gameover">
    <button id="reiniciar"></button>
  </div>

  <!-- SCRIPTS -->

  <script src="js/main.js" type="module"></script>
  <script src="js/controls/buttonsPc.js" type="module"></script>
  <script src="js/controls/buttonsAndroid.js" type="module"></script>
  <script src="js/ui/setting.js" type="module"></script>
  <script src="js/ui/effects.js" type="module"></script>
</body>

</html>
